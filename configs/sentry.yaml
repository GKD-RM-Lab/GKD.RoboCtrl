schema_version: 1
profile: sentry

cans:
  - {name: CAN_CHASSIS, interface_name: CAN_CHASSIS}
  - {name: CAN_BULLET, interface_name: CAN_BULLET}
  - {name: CAN_GIMBAL, interface_name: CAN_GIMBAL}

serials:
  - {name: serial_big_yaw, device: /dev/IMU_BIG_YAW, baud_rate: 115200}
  - {name: serial_small_yaw, device: /dev/IMU_SMALL_YAW, baud_rate: 115200}

dji_motors:
  # Sentry chassis: old GKD_Control order is LF=1, RF=2, RR=3, LR=4.
  - {type_: M3508, id: 1, name: left_front_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 10.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 2, name: right_front_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 10.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 3, name: right_rear_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 10.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 4, name: left_rear_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 10.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}

  # Main sentry gimbal (the currently supported gimbal instance).
  - {type_: M6020, id: 1, name: gimbal_yaw_motor, can_name: CAN_GIMBAL, radius: 1.0, pid_params: {kp: 765.8683, ki: 2.8509, kd: 0.0, max_out: 850.0, max_iout: 250.0}, control_time: {count: 1, unit: milliseconds}}
  - {type_: M6020, id: 2, name: gimbal_pitch_motor, can_name: CAN_GIMBAL, radius: 1.0, pid_params: {kp: 5500.0, ki: 100.0, kd: 0.0, max_out: 30000.0, max_iout: 5000.0}, control_time: {count: 1, unit: milliseconds}}

  # Auxiliary head gimbal from the old sentry controller. It is configured for
  # topology validation, but is not bound until multi-gimbal support is added.
  - {type_: M6020, id: 1, name: head_yaw_motor, can_name: CAN_BULLET, radius: 1.0, pid_params: {kp: 5000.0, ki: 0.0, kd: 0.0, max_out: 20000.0, max_iout: 5000.0}, control_time: {count: 1, unit: milliseconds}}
  - {type_: M6020, id: 2, name: head_pitch_motor, can_name: CAN_BULLET, radius: 1.0, pid_params: {kp: 4144.22, ki: 117.94, kd: 0.0, max_out: 30000.0, max_iout: 15000.0}, control_time: {count: 1, unit: milliseconds}}

  # Sentry friction wheels and trigger motor.
  - {type_: M3508, id: 1, name: left_friction, can_name: CAN_BULLET, radius: 0.075, pid_params: {kp: 2000.0, ki: 0.05, kd: 10.0, max_out: 16000.0, max_iout: 2000.0}, control_time: {count: 1, unit: milliseconds}}
  - {type_: M3508, id: 2, name: right_friction, can_name: CAN_BULLET, radius: 0.075, pid_params: {kp: 2000.0, ki: 0.05, kd: 10.0, max_out: 16000.0, max_iout: 2000.0}, control_time: {count: 1, unit: milliseconds}}
  - {type_: M3508, id: 1, name: trigger, can_name: CAN_GIMBAL, radius: 0.075, pid_params: {kp: 800.0, ki: 0.5, kd: 0.0, max_out: 10000.0, max_iout: 9000.0}, control_time: {count: 1, unit: milliseconds}}

control_pad: {name: control_pad, serial_name: serial_big_yaw}
imu: {name: imu, serial_name: serial_big_yaw}

robot:
  gimbal_info:
    imu_key: imu
    yaw_motor_key: gimbal_yaw_motor
    pitch_motor_key: gimbal_pitch_motor
    yaw_angle_pid: {kp: 8.0, ki: 0.0, kd: 10.0, max_out: 15.0, max_iout: 5.0}
    pitch_angle_pid: {kp: 15.0, ki: 0.0, kd: 10.0, max_out: 10.0, max_iout: 0.0}
    yaw_direction: 1.0
    pitch_direction: 1.0
    pitch_min: -0.18
    pitch_max: 0.51
    control_time: {count: 1, unit: milliseconds}
  chassis_info:
    left_front_motor: left_front_motor
    right_front_motor: right_front_motor
    left_rear_motor: left_rear_motor
    right_rear_motor: right_rear_motor
    control_time: {count: 2, unit: milliseconds}
    max_rotate_speed: 1.0
  shoot_info:
    friction_params: {acc: 100.0}
    friction_max_speed: 2.5
    trigger_speed: 6.0
    friction_ready_speed: 1.5
    jam_current: 4000.0
    jam_speed: 1.0
    jam_release_time: {count: 50, unit: milliseconds}
    control_time: {count: 1, unit: milliseconds}
    left_friction_motor: left_friction
    right_friction_motor: right_friction
    trigger_motor: trigger
  chassis_type: device.gkd_sentry_chassis.v1
  gimbal_type: device.gkd_sentry_gimbal.v1
  control_pad_key: control_pad
  enable_chassis: true
  enable_gimbal: true
  enable_shoot: true
