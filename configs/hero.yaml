schema_version: 1
profile: hero

cans:
  - {name: CAN_CHASSIS, interface_name: CAN_CHASSIS}
  - {name: CAN_GIMBAL, interface_name: CAN_GIMBAL}
serials:
  - {name: serial1, device: /dev/IMU_HERO, baud_rate: 115200}
dji_motors:
  - {type_: M3508, id: 3, name: left_front_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 10.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 4, name: right_front_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 10.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 1, name: right_rear_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 10.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 2, name: left_rear_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 10.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M6020, id: 3, name: gimbal_yaw_motor, can_name: CAN_GIMBAL, radius: 1.0, pid_params: {kp: 8000.0, ki: 0.0, kd: 0.0, max_out: 20000.0, max_iout: 5000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 1, name: gimbal_pitch_motor, can_name: CAN_GIMBAL, radius: 0.075, pid_params: {kp: 5500.0, ki: 100.0, kd: 0.0, max_out: 30000.0, max_iout: 5000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 3, name: left_friction, can_name: CAN_GIMBAL, radius: 0.075, pid_params: {kp: 2000.0, ki: 0.05, kd: 10.0, max_out: 16000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 2, name: right_friction, can_name: CAN_GIMBAL, radius: 0.075, pid_params: {kp: 2000.0, ki: 0.05, kd: 10.0, max_out: 16000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 4, name: trigger, can_name: CAN_GIMBAL, radius: 0.075, pid_params: {kp: 2000.0, ki: 0.5, kd: 0.0, max_out: 10000.0, max_iout: 9000.0}, control_time: {count: 2, unit: milliseconds}}

control_pad: {name: control_pad, serial_name: serial1}
imu: {name: imu, serial_name: serial1}
robot:
  gimbal_info:
    imu_key: imu
    yaw_motor_key: gimbal_yaw_motor
    pitch_motor_key: gimbal_pitch_motor
    yaw_angle_pid: {kp: 12.0, ki: 0.0, kd: 0.3, max_out: 10.0, max_iout: 0.0}
    pitch_angle_pid: {kp: 15.0, ki: 0.0, kd: 10.0, max_out: 10.0, max_iout: 0.0}
    control_time: {count: 1, unit: milliseconds}
  chassis_info:
    control_time: {count: 2, unit: milliseconds}
  shoot_info:
    friction_params: {acc: 100.0}
    friction_max_speed: 20.0
    trigger_speed: -2.0
  chassis_type: ctrl.standard_mecanum_chassis.v1
  gimbal_type: ctrl.standard_imu_2axis_gimbal.v1
  control_pad_key: control_pad
  enable_chassis: true
  enable_gimbal: true
  enable_shoot: true
