# Migrated software profile; PID ki=legacy_ki/dt and kd=legacy_kd*dt.
# Hardware signs, gains and zero positions still require bench verification.
schema_version: 1
profile: hero
cans:
  - {name: CAN_CHASSIS, interface_name: CAN_CHASSIS}
  - {name: CAN_GIMBAL, interface_name: CAN_GIMBAL}
serials:
  - {name: serial1, device: /dev/IMU_HERO, baud_rate: 115200}
  - {name: referee, device: /dev/REFEREE, baud_rate: 115200, raw: true}
dji_motors:
  - {type_: M3508, id: 3, name: left_front_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 5000.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 4, name: right_front_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 5000.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 1, name: right_rear_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 5000.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M3508, id: 2, name: left_rear_motor, can_name: CAN_CHASSIS, radius: 0.075, pid_params: {kp: 15000.0, ki: 5000.0, kd: 0.0, max_out: 14000.0, max_iout: 2000.0}, control_time: {count: 2, unit: milliseconds}}
  - {type_: M6020, id: 3, name: gimbal_yaw_motor, can_name: CAN_GIMBAL, radius: 1.0, pid_params: {kp: 8000.0, ki: 0.0, kd: 0.0, max_out: 20000.0, max_iout: 5000.0}, control_time: {count: 1, unit: milliseconds}}
  - {type_: M3508, id: 1, name: gimbal_pitch_motor, can_name: CAN_GIMBAL, radius: 0.075, pid_params: {kp: 5500.0, ki: 100000.0, kd: 0.0, max_out: 16384.0, max_iout: 5000.0}, control_time: {count: 1, unit: milliseconds}}
  - {type_: M3508, id: 3, name: left_friction, can_name: CAN_GIMBAL, radius: 0.075, pid_params: {kp: 2000.0, ki: 50.0, kd: 0.01, max_out: 16000.0, max_iout: 2000.0}, control_time: {count: 1, unit: milliseconds}}
  - {type_: M3508, id: 2, name: right_friction, can_name: CAN_GIMBAL, radius: 0.075, pid_params: {kp: 2000.0, ki: 50.0, kd: 0.01, max_out: 16000.0, max_iout: 2000.0}, control_time: {count: 1, unit: milliseconds}}
  - {type_: M3508, id: 4, name: trigger, can_name: CAN_GIMBAL, radius: 0.075, pid_params: {kp: 2000.0, ki: 500.0, kd: 0.0, max_out: 10000.0, max_iout: 9000.0}, control_time: {count: 1, unit: milliseconds}}
control_pad: {name: control_pad, serial_name: serial1}
imu: {name: imu, serial_name: serial1, pitch_sign: -1.0, gyro_scale: 1.7453292519943296e-05}
robot:
  gimbal_info:
    imu_key: imu
    yaw_motor_key: gimbal_yaw_motor
    pitch_motor_key: gimbal_pitch_motor
    yaw_angle_pid: {kp: 12.0, ki: 0.0, kd: 0.0003, max_out: 10.0, max_iout: 0.0}
    pitch_angle_pid: {kp: 15.0, ki: 0.0, kd: 0.01, max_out: 10.0, max_iout: 0.0}
    control_time: {count: 1, unit: milliseconds}
    yaw_motor_type: dji
    pitch_motor_type: dji
    yaw_angle_direction: -1.0
    yaw_recenter_direction: 1.0
    yaw_current_control: true
    pitch_current_control: true
    yaw_zero_calibrated: true
    recenter_on_enable: true
    init_tolerance: 0.1
    init_settle_time: {count: 2000, unit: milliseconds}
    init_pitch: 0.0
    yaw_zero: 2.9651848629829445
    yaw_relative_pid: {kp: 10, ki: 0.0, kd: 0.0003, max_out: 10, max_iout: 0}
    yaw_rate_pid: {kp: 8000, ki: 0.0, kd: 0.0, max_out: 20000, max_iout: 5000}
    pitch_rate_pid: {kp: 5500, ki: 100000.0, kd: 0.0, max_out: 30000, max_iout: 5000}
  chassis_info:
    left_front_motor: left_front_motor
    right_front_motor: right_front_motor
    left_rear_motor: left_rear_motor
    right_rear_motor: right_rear_motor
    control_time: {count: 2, unit: milliseconds}
    max_rotate_speed: 1.0
    wheel_directions: [-1, 1, -1, 1]
  shoot_info:
    friction_params: {acc: 1.0}
    friction_max_speed: 1.5
    trigger_speed: -2.0
    control_time: {count: 1, unit: milliseconds}
    enforce_referee: true
    bullet_caliber: 42
  chassis_type: device.gkd_sentry_chassis.v1
  gimbal_type: device.gkd_sentry_gimbal.v1
  control_pad_key: control_pad
  enable_chassis: true
  enable_gimbal: true
  enable_shoot: true
  motion_info:
    control_time: {count: 2, unit: milliseconds}
    follow_pid: {kp: 2, ki: 0.0, kd: 0.02, max_out: 6, max_iout: 0.2}
    follow_direction: 1.0
    enable_follow: true
    primary_aim_key: primary_aim
    remote_logger_key: telemetry
    telemetry_period: {count: 50, unit: milliseconds}
power: {enabled: true, configured_power_limit: 35.0, offline_power_limit: 35.0, max_cap_boost: 0.0, rls_enabled: false}
referee: {serial_name: referee, offline_timeout: {count: 1000, unit: milliseconds}, ui_enabled: true, ui_period: {count: 100, unit: milliseconds}}
super_cap: {can_name: CAN_CHASSIS, receive_id: 81, command_id: 97, max_power_limit: 150, resend_time: {count: 50, unit: milliseconds}, command_timeout: {count: 100, unit: milliseconds}}
udp_servers:
  - {key_: control_udp, address: "127.0.0.1", port: 11451}
aim_links:
  - {key_: primary_aim, udp_name: control_udp, address: "127.0.0.1", port: 11453, header: 106, wire_format: legacy_14, target_timeout_ms: 100}
remote_loggers:
  - {key_: telemetry, udp_name: control_udp, address: "127.0.0.1", port: 8080}
